services:
  redis:
    image: redis:7.2.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  stt-service:
    build:
      context: ./STT
      args:
        MODEL: ${MODEL}
    container_name: stt-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      MODEL: ${MODEL}
      MIN_SEND_S: ${MIN_SEND_S}
      PREFERRED_SEND_S: ${PREFERRED_SEND_S}
      MAX_SEND_S: ${MAX_SEND_S}
      SILENCE_AFTER_S: ${SILENCE_AFTER_S}
      CHAR_THRESHOLD: ${CHAR_THRESHOLD}
      TIME_THRESHOLD: ${TIME_THRESHOLD}
      STT_PORT: 8081

      # Whisper params
      THREADS: 4
      CHUNK_SIZE_S: 10
      BEAM_SIZE: 1
      COMPUTE_TYPE: int8 # "float16" for GPU or "int8" for CPU
      DEVICE: CPU # "GPU" or "CPU"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  spring-backend:
    build:
      context: ./Spring_boot
    container_name: spring-backend
    restart: unless-stopped
    ports:
      - "8080:8080"  # HTTP и WS
      - "8443:8443"  # HTTPS и WSS
    volumes:
      - ./audio-dumps:/app/audio-dumps 
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY}
      STT_URL: ${STT_URL}
      AUDIO_DUMP_ENABLED: true
    depends_on:
      redis:
        condition: service_healthy
      stt-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  browser-bot:
    build:
      context: ./Browser_bot
    container_name: browser-bot
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_QUEUE_KEY: "meeting_tasks"
      BACKEND_BASE_URL: "http://spring-backend:8080"
      AUDIO_WS_URL: "wss://spring-backend:8443/ws/client"
      MAX_CONCURRENT_BOTS: 4
    depends_on:
      spring-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
        
volumes:
  redis_data: